name: Deploy development image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy or roll back
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy-development:
    needs: publish
    if: ${{ secrets.DEVELOPMENT_DEPLOY_HOOK != '' && secrets.DEVELOPMENT_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger development deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEVELOPMENT_DEPLOY_HOOK }}
          HEALTH_URL: ${{ secrets.DEVELOPMENT_HEALTH_URL }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          test -n "$DEPLOY_HOOK"
          test -n "$HEALTH_URL"
          curl --fail-with-body --request POST \
            --data-urlencode "image=$IMAGE" \
            --data-urlencode "tag=$IMAGE_TAG" \
            "$DEPLOY_HOOK"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Development deployment did not become healthy: $HEALTH_URL" >&2
          exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger rollback deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEVELOPMENT_DEPLOY_HOOK }}
          HEALTH_URL: ${{ secrets.DEVELOPMENT_HEALTH_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          test -n "$DEPLOY_HOOK"
          test -n "$HEALTH_URL"
          curl --fail-with-body --request POST \
            --data-urlencode "image=$IMAGE" \
            --data-urlencode "tag=$IMAGE_TAG" \
            "$DEPLOY_HOOK"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Rollback deployment did not become healthy: $HEALTH_URL" >&2
          exit 1
